<!DOCTYPE html>
<html lang="it" class="editoriali-page has-panel-menu">
<head>

    <meta name="twitter:image" content="img/foto/Street Photography/1.jpg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/ph/bianco.png">
    <link rel="preload" href="stile.css" as="style">
    <link rel="preload" href="img/foto/Street Photography/1.jpg" as="image" fetchpriority="high">
    <!-- Preconnect per Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" type="text/css" href="stile.css">
    
    <!-- Title -->
    <title>Editoriali - sebisorb | Fotografia editoriale e reportage</title>

<body class="pagina-gallery">
    <div class="bg-fixed-wrapper" aria-hidden="true">
        <div class="bg-fixed-black"></div>
        <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
            <source src="img/ph/sfondoanimatoverticale.mp4?v=2" type="video/mp4" media="(max-width: 1023px)">
            <source src="img/ph/sfondoanimato.mp4?v=2" type="video/mp4" media="(min-width: 1024px)">
        </video>
    </div>
    <!-- Header con navigazione -->
    <div id="header-placeholder"></div>

    <main class="gallery-main" role="main">

                <p class="gallery-hero-description">Fotografia editoriale e reportage per riviste, pubblicazioni e progetti culturali.</p>

        </div>

        <section id="editoriali" class="gallery-section" aria-labelledby="hero-title">
            <div class="gallery-grid-container">
                <div class="gallery-grid" data-section="editoriali">
                    <div class="gallery-grid-item hero">
                        <img src="img/foto/Street Photography/1.jpg" alt="Editoriale 1" loading="eager" decoding="async" fetchpriority="high" width="2400" height="1600">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/2.jpg" alt="Editoriale 2" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/3.jpg" alt="Editoriale 3" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/4.jpg" alt="Editoriale 4" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/5.jpg" alt="Editoriale 5" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/6.jpg" alt="Editoriale 6" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/7.jpg" alt="Editoriale 7" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/8.jpg" alt="Editoriale 8" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/9.jpg" alt="Editoriale 9" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/10.jpg" alt="Editoriale 10" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item">
                        <img src="img/foto/Street Photography/11.jpg" alt="Editoriale 11" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-grid-item series-end">
                        <img src="img/foto/Street Photography/12.jpg" alt="Editoriale 12" loading="lazy" decoding="async">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="page-loader.js"></script>
    <script src="image-dimensions.js" defer></script>
    <script src="components-loader.js"></script>
    <script src="grain-sequence.js" defer></script>
    <script src="gallery.js" defer></script>
</body>
</html>
