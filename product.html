<body class="pagina-gallery">
    <div class="bg-fixed-wrapper" aria-hidden="true">
        <div class="bg-fixed-black"></div>
        <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">

            <source src="img/ph/sfondoanimato.mp4?v=2" type="video/mp4" media="(min-width: 1024px)">

            </section>
        </div>

        <section id="product" class="gallery-section" aria-labelledby="product-title">

            <p class="gallery-section-description">Fotografia di prodotto per e-commerce, cataloghi e comunicazione commerciale. Immagini che valorizzano i prodotti e aumentano le vendite.</p>
            <div class="gallery-carousel-container personale-carousel-container">
                <div class="gallery-carousel-wrapper">
                    <button class="gallery-nav-arrow gallery-nav-prev" data-carousel="carousel-product" aria-label="Foto precedente" style="display: none;">
                        <span>◀</span>
                    </button>
                    <div class="gallery-carousel personale-carousel" id="carousel-product" data-section="product">
                        <div class="gallery-photo" data-index="0">
                            <img src="img/foto/Street Photography/1.jpg" alt="Product Photography 1" loading="lazy" decoding="async">
                        </div>

                        <!-- 
                        <div class="gallery-photo" data-index="1">

                    <button class="gallery-nav-arrow gallery-nav-next" data-carousel="carousel-product" aria-label="Foto successiva">

                    </button>
                </div>
                <div class="personale-strip-viewport" aria-hidden="true">
                    <div class="personale-carousel-strip" data-carousel="carousel-product" aria-label="Anteprime Product"></div>
                </div>
            </div>
